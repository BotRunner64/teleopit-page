  </defs>
  <rect width="1440" height="620" fill="#f7fbff"/>
  <text x="720" y="72" fill="#18283a" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">METHOD OVERVIEW PLACEHOLDER</text>
  <text x="720" y="106" fill="#698096" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Replace this SVG with the final system figure</text>

  <path d="M414 314h118M906 314h118" fill="none" stroke="#76a8d5" stroke-width="4" marker-end="url(#arrow)"/>

